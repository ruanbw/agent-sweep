name: CI

on:
  push:
    branches: [master]
  pull_request:

# 只读。CI 不产物件、不碰 Release，发版全部由 release.yml 负责。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 版本只认 go.mod，升级 Go 时不需要回来改 workflow。
          go-version-file: go.mod
          cache: true

      # cgo 链接系统 WebKit，macos-latest 自带完整 Xcode，不需要额外装依赖。
      - name: go vet
        run: go vet ./...

      # 加 -race：扫描、撤销、更新替换这些路径的并发问题，只有竞态检测器能兜住。
      - name: go test (race)
        run: go test -race ./...

      # 发版脚本也是代码。在 PR 阶段真打一次 universal 包、跑一遍 Makefile 自检：
      # Makefile / Info.plist / 版本注入的回归就不会拖到打 tag 之后才暴露。
      # 用 0.0.0-ci 这种明显非发布的版本，避免和真实发布产物混淆。
      - name: Distribution smoke test
        run: make dist VERSION=0.0.0-ci
