name: Release

# 只由 tag 触发：推 v0.1.0 就发 0.1.0。版本号只有一个来源，不做手动 dispatch，
# 免得「tag 是 v0.2.0、产物是 0.1.0」这种只会在用户更新时才暴露的问题。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 需要 tag；这里显式传 VERSION，但保留历史能让包里的版本可追溯。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 先跑测试：一个坏版本发出去比晚发十分钟贵得多。
      - name: Test
        run: make test

      - name: Build universal distribution
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      # 发布前最后一关：三个资产必须真的存在，且确实是 universal。
      # 缺任何一个都直接失败，不会出现「Release 建好了但没附件」的半成品。
      - name: Verify artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/AgentSweep-v${VERSION}-darwin-universal.zip"
          TARBALL="dist/agentsweep-v${VERSION}-darwin-universal.tar.gz"
          test -f "${ZIP}"
          test -f "${TARBALL}"
          test -f dist/checksums.txt
          lipo -archs AgentSweep.app/Contents/MacOS/AgentSweep | grep -qw arm64
          lipo -archs AgentSweep.app/Contents/MacOS/AgentSweep | grep -qw x86_64
          (cd dist && shasum -a 256 -c checksums.txt)
          unzip -Z1 "${ZIP}" | head -1 | grep -qx 'AgentSweep.app/'
          test "$(plutil -extract CFBundleShortVersionString raw -o - AgentSweep.app/Contents/Info.plist)" = "${VERSION}"

      # 非 draft、附生成好的 release notes。三个资产名就是应用内更新器的契约。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/AgentSweep-v${VERSION}-darwin-universal.zip" \
            "dist/agentsweep-v${VERSION}-darwin-universal.tar.gz" \
            "dist/checksums.txt" \
            --verify-tag \
            --title "AgentSweep ${GITHUB_REF_NAME}" \
            --generate-notes
